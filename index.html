<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>NetViet HR – Marketing</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=20260722-netviettv"/>
  <link rel="stylesheet" href="/styles/main.css"/>
</head>
<body>

<!-- ═══════════════════ LOGIN ═══════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <img class="login-logo-img" src="https://pub-84c3902526ad4c82b488275b43b39e3a.r2.dev/agent-assets/c2523c17-d234-4f27-8357-3fa41ad984f6/b3e0a752-24e6-4465-a2e3-f6f6286c520e.jpg" alt="NetViet HR"/>
      <p>Marketing Company Management</p>
    </div>
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label>Email / Mã nhân viên</label>
        <input id="login-user" type="text" placeholder="Nhập email hoặc mã nhân viên" autocomplete="off"/>
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <div class="pw-wrap">
          <input id="login-pw" type="password" placeholder="Nhập mật khẩu" autocomplete="new-password"/>
          <button type="button" id="pw-eye" class="pw-eye-btn" aria-label="Hiện mật khẩu">👁</button>
        </div>
      </div>
      <div id="login-error" class="login-error hidden"></div>
      <button id="login-btn" type="submit" class="btn-primary w-full" style="margin-top:4px;">Đăng nhập</button>
    </form>
  </div>
</div>

<!-- ═══════════════════ APP SHELL ═══════════════════ -->
<div id="app" class="hidden">

  <!-- Sidebar overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <img class="brand-logo-img" src="https://pub-84c3902526ad4c82b488275b43b39e3a.r2.dev/agent-assets/c2523c17-d234-4f27-8357-3fa41ad984f6/b3e0a752-24e6-4465-a2e3-f6f6286c520e.jpg" alt="NetViet HR"/>
        <div class="brand-sub">Marketing Pro</div>
      </div>
      <button class="sidebar-close" id="sidebar-close">✕</button>
    </div>

    <div class="sidebar-profile">
      <div id="sidebar-av" class="avatar avatar-md"></div>
      <div style="min-width:0;">
        <div id="sidebar-name" class="profile-name truncate">—</div>
        <div id="sidebar-role" class="profile-role">—</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <!-- Main -->
      <div class="nav-section-label">Tổng quan</div>
      <a href="#/dashboard" class="nav-item" data-nav="dashboard">
        <span class="nav-icon">🏠</span><span>Dashboard</span>
      </a>

      <!-- HR Section -->
      <div class="nav-section-label">Nhân sự</div>
      <a href="#/attendance" class="nav-item" data-nav="attendance">
        <span class="nav-icon">⏱️</span><span>Chấm công</span>
      </a>
      <a href="#/leave" class="nav-item" data-nav="leave">
        <span class="nav-icon">🏖️</span><span>Nghỉ phép</span>
      </a>
      <a href="#/tasks" class="nav-item" data-nav="tasks">
        <span class="nav-icon">📋</span><span>Công việc</span>
      </a>
      <a href="#/invoices" class="nav-item" data-nav="invoices">
        <span class="nav-icon">💵</span><span>Phiếu lương</span>
      </a>
      <a href="#/evaluation" class="nav-item" data-nav="evaluation">
        <span class="nav-icon">📈</span><span>Đánh giá hiệu suất</span>
      </a>

      <!-- Admin Section -->
      <div class="nav-section" id="admin-nav">
        <div class="nav-section-label">Quản lý công ty</div>
        <a href="#/users" class="nav-item" data-nav="users">
          <span class="nav-icon">👥</span><span>Nhân viên</span>
        </a>
        <a href="#/departments" class="nav-item" data-nav="departments">
          <span class="nav-icon">🏢</span><span>Phòng ban</span>
        </a>
        <a href="#/payroll" class="nav-item" data-nav="payroll">
          <span class="nav-icon">💰</span><span>Bảng lương</span>
        </a>
        <a href="#/recruitment" class="nav-item" data-nav="recruitment">
          <span class="nav-icon">🎯</span><span>Tuyển dụng</span>
        </a>
        <a href="#/campaigns" class="nav-item" data-nav="campaigns">
          <span class="nav-icon">📣</span><span>Chiến dịch MKT</span>
        </a>
        <a href="#/wifi" class="nav-item" data-nav="wifi">
          <span class="nav-icon">📡</span><span>WiFi Whitelist</span>
        </a>
      </div>

      <div class="nav-section-label">Hệ thống</div>
      <a href="#/settings" class="nav-item" data-nav="settings">
        <span class="nav-icon">⚙️</span><span>Cài đặt</span>
      </a>
      <a href="#/db-admin" class="nav-item hidden" data-nav="db-admin" id="db-admin-nav-item">
        <span class="nav-icon">???</span><span>Database Admin</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button id="btn-change-pw" class="nav-item w-full" style="background:none;border:none;cursor:pointer;text-align:left;">
        <span class="nav-icon">🔑</span><span>Đổi mật khẩu</span>
      </button>
      <button id="btn-logout" class="nav-item nav-logout w-full" style="background:none;border:none;cursor:pointer;text-align:left;">
        <span class="nav-icon">🚪</span><span>Đăng xuất</span>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-wrap">

    <!-- Header -->
    <header id="header">
      <button id="btn-menu" class="btn-icon" aria-label="Menu">☰</button>
      <div class="header-title">
        <div id="header-date" class="header-date"></div>
        <div id="header-clock" class="header-clock"></div>
      </div>
      <button id="header-av-btn" class="avatar-btn" aria-label="Tài khoản">
        <div id="header-av" class="avatar avatar-sm"></div>
      </button>
    </header>

    <!-- Content -->
    <main id="content"></main>
  </div>
</div>

<!-- ═══════════════════ MODAL ═══════════════════ -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3 id="modal-title">—</h3>
      <button id="modal-close" class="btn-icon" aria-label="Đóng">✕</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-footer" class="modal-footer"></div>
  </div>
</div>

<!-- ═══════════════════ TASK PANEL ═══════════════════ -->
<div id="task-panel-overlay" class="task-panel-overlay hidden"></div>
<div id="task-panel" class="task-panel hidden">
  <div class="task-panel-head">
    <button id="task-panel-back" class="btn-icon">← Quay lại</button>
    <div id="task-panel-title">Chi tiết công việc</div>
  </div>
  <div id="task-panel-body" class="task-panel-body"></div>
</div>

<!-- ═══════════════════ TOAST ═══════════════════ -->
<div id="toast-container" aria-live="polite"></div>

<script type="module" src="/src/app.js?v=20260722-remember-login"></script>
</body>
</html>
