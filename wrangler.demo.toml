name = "nexrall-hr-demo"
main = "worker.js"
compatibility_date = "2026-07-22"

[vars]
GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE"

# Nightly auto-checkout & Monthly Backup
# 17:05 UTC = 00:05 Asia/Ho_Chi_Minh daily.
# 18:00 UTC on day 1 = 01:00 Asia/Ho_Chi_Minh on day 2.
[triggers]
crons = ["5 17 * * *", "0 18 1 * *"]

[assets]
directory = ".local-public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "nexrall-hr-demo"
database_id = "8c20fc00-f890-4bf4-8274-cfb6a33c642a"

[[r2_buckets]]
binding = "HR_DOCUMENTS"
bucket_name = "netviet-hr-demo-documents"

# Cloudflare Workers AI (Edge Llama 3.3 & BAAI Embeddings)
[ai]
binding = "AI"

# Chat: one Durable Object instance per conversation for WebSocket real-time.
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

# AppSyncHub: Global Durable Object for real-time event distribution and client sync
[[durable_objects.bindings]]
name = "SYNC_HUB"
class_name = "AppSyncHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AppSyncHub"]
